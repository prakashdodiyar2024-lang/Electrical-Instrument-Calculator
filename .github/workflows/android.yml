
name: ElectricalCalc Pro - Final APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract, Test and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract ZIP
        id: project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \
            -iname '*nov-21*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP" ]; then
            ZIP=$(find . -maxdepth 2 -type f \
              -iname 'electricalc-pro*.zip' \
              -not -path './.git/*' | sort | tail -n 1)
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::ElectricalCalc Pro ZIP not found"
            exit 1
          fi

          echo "Selected ZIP: $ZIP"

          DEST="$RUNNER_TEMP/electricalcalc"
          mkdir -p "$DEST"

          unzip -q "$ZIP" -d "$DEST"

          PROJECT=""

          while IFS= read -r SETTINGS; do
            DIR=$(dirname "$SETTINGS")

            if [ -f "$DIR/app/build.gradle.kts" ] || \
               [ -f "$DIR/app/build.gradle" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(find "$DEST" -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \))

          if [ -z "$PROJECT" ]; then
            echo "::error::Android Gradle project not found"
            exit 1
          fi

          echo "Android project found: $PROJECT"
          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"

          ls -la "$PROJECT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK 22.0
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: 'platform-tools platforms;android-36.1 build-tools;36.1.0'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Build Environment
        run: |
          java -version
          gradle --version
          sdkmanager --version

          test -d "$ANDROID_HOME/platforms/android-36.1"
          test -d "$ANDROID_HOME/build-tools/36.1.0"

      - name: Create Debug Keystore
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Verify Gradle Files
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          test -f settings.gradle.kts || \
          test -f settings.gradle

          test -f app/build.gradle.kts || \
          test -f app/build.gradle

          echo "Gradle project verified"

      - name: Run Unit Tests
        id: tests
        continue-on-error: true
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle :app:testDebugUnitTest \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK file not found"
            exit 1
          fi

          echo "APK successfully generated"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElectricalCalc-Pro-100-Calculators-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Show Test Result
        if: always()
        run: |
          echo "Unit Test Result: ${{ steps.tests.outcome }}"
          echo "APK Build completed separately"
