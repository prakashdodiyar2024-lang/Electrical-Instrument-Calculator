
name: ElectricalCalc Pro - Final Gradle Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect Gradle Configuration
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          unzip -q "$ZIP_FILE" -d extracted

          echo "===== GRADLE WRAPPER PROPERTIES ====="
          cat extracted/gradle/wrapper/gradle-wrapper.properties

          echo "===== ROOT BUILD GRADLE ====="
          cat extracted/build.gradle.kts

          echo "===== SETTINGS GRADLE ====="
          cat extracted/settings.gradle.kts

          echo "===== VERSION CATALOG ====="
          if [ -f extracted/gradle/libs.versions.toml ]; then
            cat extracted/gradle/libs.versions.toml
          else
            echo "No version catalog found"
          fi

          echo "===== WRAPPER DIRECTORY ====="
          ls -lah extracted/gradle/wrapper/

          echo "===== WRAPPER SCRIPTS ====="
          find extracted -maxdepth 2 -type f \
            \( -name 'gradlew' -o -name 'gradlew.bat' -o -name 'gradle-wrapper.jar' \) -print
            

          
          
