
name: ElectricalCalc Pro APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract and Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Project ZIP
        id: project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -iname '*nov-21*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP" ]; then
            ZIP=$(find . -type f -iname '*.zip' \
              -not -path './.git/*' | head -n 1)
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::Project ZIP not found"
            exit 1
          fi

          echo "Selected: $ZIP"

          python3 - "$ZIP" "$RUNNER_TEMP/eicalc" <<'PY'
          import sys, zipfile, pathlib

          archive = zipfile.ZipFile(sys.argv[1])
          dest = pathlib.Path(sys.argv[2])
          archive.extractall(dest)

          projects = []
          for p in dest.rglob("settings.gradle.kts"):
              if (p.parent / "app/build.gradle.kts").exists():
                  projects.append(p.parent)

          for p in dest.rglob("settings.gradle"):
              if (p.parent / "app/build.gradle").exists():
                  projects.append(p.parent)

          if not projects:
              raise SystemExit("Android Gradle project not found")

          project = projects[0].resolve()
          with open(
              pathlib.Path(sys.argv[2]).parent / "project_path.txt", "w"
          ) as f:
              f.write(str(project))

          print("Project:", project)
          PY

          PROJECT=$(cat "$RUNNER_TEMP/project_path.txt")
          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug Keystore
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        continue-on-error: true
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle :app:testDebugUnitTest \
            --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle :app:assembleDebug \
            --no-daemon --stacktrace

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElectricalCalc-Pro-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

