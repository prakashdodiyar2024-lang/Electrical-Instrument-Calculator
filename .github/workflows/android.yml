
name: ElectricalCalc Pro Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Updated APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Extract ZIP Files
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          find . -type f -name "*.zip" \
            -not -path "./.git/*" -print0 |
          while IFS= read -r -d '' file; do
            echo "Extracting $file"
            unzip -oq "$file" -d extracted
          done

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path "./.git/*" \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

          VERSION="8.9"
          PROPS="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          if [ -f "$PROPS" ]; then
            DETECTED=$(sed -n \
              's/.*gradle-\([0-9][0-9A-Za-z.-]*\)-\(bin\|all\)\.zip.*/\1/p' \
              "$PROPS" | head -1)

            if [ -n "$DETECTED" ]; then
              VERSION="$DETECTED"
            fi
          fi

          echo "gradle_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.project.outputs.gradle_version }}

      - name: Generate Debug Keystore
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e

          KEYSTORE="$PROJECT_DIR/extracted/debug.keystore"

          mkdir -p "$(dirname "$KEYSTORE")"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          ls -l "$KEYSTORE"

      - name: Build Updated APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Find Generated APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK file not found"
            exit 1
          fi

          echo "APK found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Updated APK
        uses: actions/upload-artifact@v4
        with:
          name: ElectricalCalc-Pro-Updated-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

