
name: ElectricalCalc Pro - Diagnose ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect ZIP and Android project
        run: |
          echo "===== ROOT FILES ====="
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP FOUND: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "===== PROJECT FILES ====="
          find extracted -maxdepth 6 -type f \
            \( -name 'gradlew' \
            -o -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
            -o -name 'build.gradle' \
            -o -name 'build.gradle.kts' \
            -o -name 'gradle-wrapper.properties' \) \
            -print

          echo "===== ANDROID GRADLE PLUGIN VERSION ====="
          grep -R -n -E 'com.android.application|com.android.library|com.android.tools.build:gradle' extracted \
            --include='*.gradle' \
            --include='*.gradle.kts' || true

          echo "===== PROJECT ROOT CANDIDATES ====="
          find extracted -maxdepth 3 -type d -print
          
          
