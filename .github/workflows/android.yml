


name: ElectricalCalc Pro APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Updated APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Android ZIP
        id: project
        shell: bash
        run: |
          set -e

          ZIP_FILE="electricalc-pro-nov-20-2026-10-11-08-pm.zip"
          EXTRACT_DIR="$RUNNER_TEMP/electricalcalc"

          test -f "$ZIP_FILE" || {
            echo "::error::Updated ZIP file not found"
            exit 1
          }

          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          PROJECT_DIR=$(find "$EXTRACT_DIR" \
            -name settings.gradle.kts \
            -type f -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project not found"
            exit 1
          fi

          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK Manager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          echo "Android SDK Manager found"

          set +o pipefail
          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            --install \
            "platform-tools" \
            "platforms;android-36"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"

          echo "Android SDK verification successful"

      - name: Build Updated APK
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e

          if [ ! -f gradlew ]; then
            echo "::error::Gradle wrapper missing in ZIP"
            exit 1
          fi

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::Gradle wrapper JAR missing"
            exit 1
          fi

          chmod +x gradlew

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK BUILD SUCCESSFUL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElectricalCalc-Pro-Updated-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
