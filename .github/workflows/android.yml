

name: ElectricalCalc Pro - Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Latest Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW=$(find . -maxdepth 6 -type f -name gradlew \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew file not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found: $PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.PROJECT_DIR }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          chmod +x gradlew

          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.PROJECT_DIR }}
        run: |
          set -euo pipefail

          mkdir -p artifacts

          find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -exec cp {} artifacts/ \;

          if ! ls artifacts/*.apk >/dev/null 2>&1; then
            echo "ERROR: APK file not generated!"
            exit 1
          fi

          ls -lh artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElectricalCalc-Pro-100-Tools-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7
