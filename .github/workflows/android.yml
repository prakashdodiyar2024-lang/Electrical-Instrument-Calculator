

name: ElectricalCalc Pro - Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          set -e
          FILE=$(find . -maxdepth 7 -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.git/*' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          DIR=$(dirname "$FILE")

          if [ ! -f "$DIR/app/build.gradle.kts" ] && \
             [ ! -f "$DIR/app/build.gradle" ]; then
            echo "ERROR: App Gradle file not found in $DIR"
            exit 1
          fi

          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project found: $DIR"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"

      - name: Prepare Keystore and Wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1
          fi

          chmod +x gradlew

      - name: Run Unit Tests
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElectricalCalc-Pro-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
