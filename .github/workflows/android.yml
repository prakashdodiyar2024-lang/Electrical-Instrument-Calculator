
name: ElectricalCalc Pro Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        run: |
          mkdir -p extracted
          unzip -q electricalc-pro-nov-19-2026-9-52-55-pm.zip -d extracted

      - name: Find Project Root
        run: |
          ROOT=$(find extracted -type f -name settings.gradle.kts | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$ROOT")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          echo "Project found: $PROJECT_ROOT"

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$PROJECT_ROOT/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Generate Gradle Wrapper
        run: |
          cd "$PROJECT_ROOT"
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd "$PROJECT_ROOT"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElectricalCalc-Pro-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error


          
          
