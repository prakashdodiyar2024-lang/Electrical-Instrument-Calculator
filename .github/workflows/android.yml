

name: ElectricalCalc Pro APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Updated APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Updated Android ZIP
        id: project
        shell: bash
        run: |
          set -e

          ZIP_FILE="electricalc-pro-nov-20-2026-10-11-08-pm.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Updated ZIP file not found: $ZIP_FILE"
            ls -lah
            exit 1
          fi

          PROJECT_DIR="$RUNNER_TEMP/electricalcalc-project"
          mkdir -p "$PROJECT_DIR"

          unzip -q "$ZIP_FILE" -d "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "::error::settings.gradle file not found"
            find "$PROJECT_DIR" -maxdepth 4 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::app/build.gradle file not found"
            exit 1
          fi

          GRADLE_VERSION="9.3.1"

          if [ -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            FOUND_VERSION=$(sed -n 's/.*gradle-\([0-9][0-9.]*\)-.*/\1/p' \
              "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" | head -n 1)

            if [ -n "$FOUND_VERSION" ]; then
              GRADLE_VERSION="$FOUND_VERSION"
            fi
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "gradle_version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"

          echo "Android project found successfully."
          echo "Gradle version: $GRADLE_VERSION"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.project.outputs.gradle_version }}

      - name: Prepare Debug Keystore and Gradle Wrapper
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper \
              --gradle-version "${{ steps.project.outputs.gradle_version }}" \
              --distribution-type bin \
              --no-daemon
          fi

          chmod +x gradlew

          ./gradlew --version

      - name: Run Unit Tests
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ./gradlew :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

          test -f app/build/outputs/apk/debug/app-debug.apk

          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElectricalCalc-Pro-Updated-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
